<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SberHelp</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="app">

        <!-- ШАПКА -->

        <header class="header">

            <div class="brand">

                <img
                    src="assets/logo.png"
                    alt="SberHelp"
                    class="brand-logo"
                    onerror="this.style.display='none'"
                >

                <span class="brand-dot">
                    ✦
                </span>

                <span class="brand-name">
                    SberHelp
                </span>

            </div>


            <button
                class="profile-button"
                type="button"
                aria-label="Профиль"
            >
                ○
            </button>

        </header>


        <!-- СЮДА JS БУДЕТ ВСТАВЛЯТЬ ЭКРАНЫ -->

        <main
            id="screen"
            class="screen"
        ></main>

    </div>


    <script src="js/chat.js"></script>

</body>

</html>
